services:
  - type: web
    name: telemeric-uzum-collector
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: collector
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: TELEGRAM_CHAT_ID
        value: -1002707306458
      - key: TELEMERIC_SITE_URL
        value: https://telegram-support-analytics.s-v-tolibov.chatgpt.site
      - key: HISTORY_LIMIT
        value: 5000
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_COLLECTOR_SECRET
        sync: false
      - key: SITES_AUTH_TOKEN
        sync: false
      - key: SETUP_TOKEN
        generateValue: true
