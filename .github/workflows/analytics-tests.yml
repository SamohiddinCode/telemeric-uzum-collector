name: Analytics tests

on:
  pull_request:
  push:
    branches:
      - feature/daily-sla-analytics

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py bootstrap.py analytics_config.py analytics_store.py analytics_engine.py report_renderer.py daily_report.py
      - run: python -m unittest discover -s tests -v
